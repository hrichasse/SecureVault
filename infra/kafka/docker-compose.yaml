# Apache Kafka local para el streaming de eventos de negocio de SecureVault.
#
#   npm run kafka:up     → levanta Kafka, crea el topic y abre Kafka UI (http://localhost:8080)
#   npm run kafka:down   → detiene y borra los contenedores (y con ellos los mensajes)
#
# Un solo broker en modo KRaft (sin Zookeeper): suficiente para desarrollo y demo.
# Escucha en dos puertos:
#   - localhost:9092 → para la app y los scripts que corren en tu máquina
#   - kafka:19092    → para los contenedores de esta misma red (Kafka UI, init)
name: securevault-kafka

services:
  kafka:
    image: apache/kafka:3.9.2
    container_name: sv-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Un solo broker: los topics internos no pueden replicarse
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los topics se crean explícitamente (servicio kafka-init), no al primer uso
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Crea el topic del caso y termina. Idempotente (--if-not-exists).
  kafka-init:
    image: apache/kafka:3.9.2
    container_name: sv-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --create --if-not-exists \
          --topic securevault.eventos-negocio \
          --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --describe --topic securevault.eventos-negocio
    restart: "no"

  # Interfaz web para ver topics, particiones, mensajes y grupos de consumidores
  kafka-ui:
    image: kafbat/kafka-ui:v1.4.2
    container_name: sv-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: securevault-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy
