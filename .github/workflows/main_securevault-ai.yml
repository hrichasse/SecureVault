# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - securevault-ai

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test -- --ci --forceExit --passWithNoTests

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: npm install and build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_APP_URL: https://securevault-ai.azurewebsites.net
        run: |
          npm ci
          npm run build

      - name: Prepare standalone package
        run: |
          # Copy static assets into standalone
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # Save Prisma generated client to a VISIBLE directory (not .prisma hidden dir)
          # Oryx strips hidden dirs from node_modules.tar.gz, so we save it separately
          mkdir -p .next/standalone/prisma_generated/client
          cp -r node_modules/.prisma/client/* .next/standalone/prisma_generated/client/
          # Copy prisma schema (needed for runtime)
          mkdir -p .next/standalone/prisma
          cp -r prisma/schema.prisma .next/standalone/prisma/schema.prisma

      - name: Create deployment zip
        run: |
          cd .next/standalone
          zip -r ../../node-app.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_59A22CE04ECE40A1966CB3DBA2535BDD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D342752AC6F84017A36CEA37188E9F56 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8186BFDD74BB4110BD7798B17C16372D }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'securevault-ai'
          slot-name: 'Production'
          package: node-app.zip